---
- name: Configure persistent kernel module loading
  ansible.builtin.template:
    src: modules-load.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'

- name: Load required kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
    creates: "/sys/module/{{ item }}"
  loop: "{{ kubernetes_kernel_modules }}"

- name: Configure persistent Kubernetes sysctl settings
  ansible.builtin.template:
    src: k8s-sysctl.conf.j2
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: '0644'

- name: Read current sysctl values
  ansible.builtin.command:
    cmd: "sysctl -n {{ item.name }}"
  loop: "{{ kubernetes_sysctl_settings }}"
  register: kubernetes_sysctl_current
  changed_when: false

- name: Apply sysctl values when they differ
  ansible.builtin.command:
    cmd: "sysctl -w {{ item.item.name }}={{ item.item.value }}"
  loop: "{{ kubernetes_sysctl_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | trim != (item.item.value | string)
