---
# 1. Load the modules immediately
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kubernetes_kernel_modules }}"

# 2. Persist modules on boot (Using inline Jinja to write the list)
- name: Persist kernel modules on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      {% for module in kubernetes_kernel_modules %}
      {{ module }}
      {% endfor %}
    mode: '0644'

# 3. Apply sysctl settings immediately
- name: Apply sysctl settings immediately
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop: "{{ kubernetes_sysctl_settings }}"

# 4. Persist sysctl on boot (Using inline Jinja to write the dictionary)
- name: Persist sysctl settings on boot
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      {% for setting in kubernetes_sysctl_settings %}
      {{ setting.name }} = {{ setting.value }}
      {% endfor %}
    mode: '0644'