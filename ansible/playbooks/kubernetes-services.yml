---
- name: Ensure Kubernetes node services are configured
  hosts: kubernetes
  become: true
  gather_facts: false

  tasks:
    - name: Ensure containerd is running and enabled
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true

    - name: Ensure kubelet is running and enabled
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true
