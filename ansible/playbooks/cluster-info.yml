---
- name: Collect information from Kubernetes nodes
  hosts: kubernetes
  gather_facts: true

  tasks:
    - name: Display node information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ inventory_hostname }}"
          - "Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "IP Address: {{ ansible_default_ipv4.address }}"
          - "Node Role: {{ node_role }}"

    - name: Check root filesystem usage
      ansible.builtin.command:
        cmd: df -hP /
      register: root_filesystem
      changed_when: false

    - name: Display node resource health
      ansible.builtin.debug:
        msg:
          - "CPU vCPUs: {{ ansible_processor_vcpus }}"
          - "Free Memory: {{ ansible_memfree_mb }} MB / {{ ansible_memtotal_mb }} MB"
          - "Root Filesystem: {{ root_filesystem.stdout_lines[1] }}"
